<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Lyric Visualizer</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #030304;
  font-family: "IBM Plex Mono", monospace;
}

body {
  touch-action: manipulation;
}

/* =========================
   MAIN STAGE
========================= */

#stage {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;

  display: flex;
  align-items: center;
  justify-content: center;

  overflow: hidden;

  background:
    radial-gradient(
      circle at 50% 42%,
      rgba(120, 8, 15, .20),
      rgba(3, 3, 4, .95) 65%
    );

  transition:
    transform .35s cubic-bezier(.2,.8,.2,1),
    filter .35s ease;
}

#stage.zoom {
  transform: scale(1.035);
  filter: saturate(1.2);
}

/* =========================
   BACKGROUND GLOW
========================= */

#stage::before {
  content: "";
  position: absolute;
  inset: -20%;

  background:
    radial-gradient(
      circle at center,
      rgba(255, 0, 20, .10),
      transparent 45%
    );

  animation: backgroundPulse 5s ease-in-out infinite;
  pointer-events: none;
  z-index: 0;
}

@keyframes backgroundPulse {
  0%,100% {
    opacity: .45;
    transform: scale(1);
  }

  50% {
    opacity: .9;
    transform: scale(1.12);
  }
}

/* =========================
   VIDEO
========================= */

#video {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
  pointer-events: none;
}

/* =========================
   WAVEFORM
========================= */

#wave {
  position: absolute;
  inset: 0;

  width: 100%;
  height: 100%;

  z-index: 1;

  opacity: .75;
  pointer-events: none;
}

/* =========================
   RED WASH
========================= */

#redwash {
  position: absolute;
  inset: -10%;

  background:
    radial-gradient(
      circle at center,
      rgba(255, 0, 20, .48) 0%,
      rgba(180, 0, 10, .18) 35%,
      transparent 72%
    );

  opacity: 0;

  transition:
    opacity .35s ease,
    transform .35s ease;

  pointer-events: none;
  z-index: 2;
}

#redwash.on {
  opacity: 1;
  transform: scale(1.08);
}

/* =========================
   SCANLINES
========================= */

#scanlines {
  position: absolute;
  inset: 0;

  z-index: 5;
  pointer-events: none;

  opacity: .12;

  background:
    repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 3px,
      rgba(255,255,255,.025) 4px
    );
}

/* =========================
   VIGNETTE
========================= */

#vignette {
  position: absolute;
  inset: 0;

  z-index: 4;
  pointer-events: none;

  background:
    radial-gradient(
      circle,
      transparent 35%,
      rgba(0,0,0,.30) 72%,
      rgba(0,0,0,.88) 100%
    );
}

/* =========================
   LYRICS
========================= */

#lyrics {
  position: relative;

  z-index: 6;

  width: 100%;
  padding: 0 24px;

  text-align: center;

  color: #f4f4f4;

  font-family: "Anton", sans-serif;
  font-size: clamp(2rem, 8vw, 5rem);

  line-height: 1.05;
  letter-spacing: .045em;

  text-shadow:
    0 2px 12px rgba(0,0,0,.8),
    0 0 22px rgba(255,255,255,.12);

  user-select: none;

  transition:
    opacity .18s ease,
    transform .25s cubic-bezier(.2,.8,.2,1),
    color .2s ease;
}

#lyrics.enter {
  transform: translateY(10px) scale(.96);
}

#lyrics.hype {
  color: #ff3030;

  text-shadow:
    0 0 8px #ff0000,
    0 0 25px #ff0000,
    0 0 55px rgba(255,0,0,.9),
    0 0 100px rgba(255,0,0,.5);

  animation:
    hypeShake .08s infinite alternate,
    hypeGlow .65s ease-in-out infinite alternate;
}

@keyframes hypeShake {
  from {
    transform: translateX(-1px) scale(1.02);
  }

  to {
    transform: translateX(1px) scale(1.035);
  }
}

@keyframes hypeGlow {
  from {
    filter: brightness(1);
  }

  to {
    filter: brightness(1.35);
  }
}

/* =========================
   WATERMARK
========================= */

#watermark {
  position: absolute;

  right: 18px;
  bottom: 16px;

  z-index: 8;

  color: rgba(255,255,255,.62);

  font-size: .72rem;
  font-weight: 600;

  letter-spacing: .08em;

  text-shadow:
    0 0 10px rgba(255,255,255,.25);
}

#watermark span {
  color: #ff3030;

  text-shadow:
    0 0 12px rgba(255,0,0,.65);
}

/* =========================
   TOP STATUS
========================= */

#status {
  position: absolute;

  top: 18px;
  left: 18px;

  z-index: 8;

  display: flex;
  align-items: center;
  gap: 8px;

  color: rgba(255,255,255,.55);

  font-size: .65rem;
  letter-spacing: .12em;

  text-transform: uppercase;
}

#statusDot {
  width: 7px;
  height: 7px;

  border-radius: 50%;

  background: #ff2525;

  box-shadow:
    0 0 8px #ff0000,
    0 0 18px rgba(255,0,0,.8);

  animation: dotPulse 1.2s infinite;
}

@keyframes dotPulse {
  0%,100% {
    opacity: .45;
    transform: scale(.85);
  }

  50% {
    opacity: 1;
    transform: scale(1.1);
  }
}

/* =========================
   TAP TO ENABLE
========================= */

#unmuteOverlay {
  position: fixed;
  inset: 0;

  z-index: 99;

  display: flex;
  align-items: center;
  justify-content: center;

  background:
    radial-gradient(
      circle,
      rgba(10,10,12,.08),
      rgba(0,0,0,.25)
    );

  cursor: pointer;

  transition:
    opacity .4s ease,
    visibility .4s ease;
}

#unmuteOverlay.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

/* =========================
   PLAY INDICATOR
========================= */

#playHint {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;

  opacity: .78;

  transition:
    transform .25s ease,
    opacity .25s ease;
}

#playCircle {
  width: 62px;
  height: 62px;

  display: flex;
  align-items: center;
  justify-content: center;

  border: 1px solid rgba(255,255,255,.25);
  border-radius: 50%;

  background: rgba(0,0,0,.25);

  backdrop-filter: blur(8px);

  box-shadow:
    0 0 25px rgba(255,0,0,.15);
}

#playIcon {
  margin-left: 4px;

  width: 0;
  height: 0;

  border-top: 9px solid transparent;
  border-bottom: 9px solid transparent;
  border-left: 14px solid white;
}

#playText {
  color: rgba(255,255,255,.75);

  font-family: "IBM Plex Mono", monospace;
  font-size: .65rem;

  letter-spacing: .18em;
  text-transform: uppercase;
}

#playHint:hover {
  transform: scale(1.05);
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

  #lyrics {
    font-size: clamp(2rem, 10vw, 3.4rem);
    padding: 0 18px;
  }

  #watermark {
    right: 12px;
    bottom: 12px;
  }

  #status {
    top: 14px;
    left: 14px;
  }
}

/* =========================
   RED FLASH
========================= */

#flash {
  position: absolute;
  inset: 0;

  z-index: 7;

  background: #ff0000;

  opacity: 0;

  pointer-events: none;
}

#flash.active {
  animation: flash .18s ease-out;
}

@keyframes flash {
  0% {
    opacity: .22;
  }

  100% {
    opacity: 0;
  }
}
</style>
</head>

<body>

<!-- TAP SCREEN -->
<div id="unmuteOverlay">
  <div id="playHint">
    <div id="playCircle">
      <div id="playIcon"></div>
    </div>

    <div id="playText">
      Tap to enable sound
    </div>
  </div>
</div>

<!-- MAIN -->
<div id="stage">

  <canvas id="wave"></canvas>

  <div id="redwash"></div>

  <div id="lyrics"></div>

  <div id="flash"></div>

  <div id="scanlines"></div>

  <div id="vignette"></div>

  <div id="status">
    <span id="statusDot"></span>
    <span>Now Playing</span>
  </div>

  <div id="watermark">
    Created by <span>Sinzu</span>
  </div>

</div>

<!-- VIDEO / AUDIO SOURCE -->
<video
  id="video"
  src="video.mp4"
  autoplay
  muted
  playsinline
  webkit-playsinline
  preload="auto"
  loop>
</video>

<script>

/* =========================================
   LYRICS
========================================= */

const lyrics = [

  { time: 0.0,  text: "" },

  { time: 0.5,  text: "SING IT AGAIN" },

  { time: 3.8,  text: "OH, WHEN YOU SING IT AGAIN" },

  { time: 6.8,  text: "CAN I BE HIM?", hype: true },

  { time: 9.0,  text: "I SWEAR THAT EVERY" },

  { time: 10.5, text: "WORD YOU SING" },

  { time: 11.8, text: "YOU WROTE" },

  { time: 12.8, text: "YOU WROTE THEM FOR ME" },

  { time: 16.8, text: "LIKE IT WAS" },

  { time: 18.0, text: "WAS A PRIVATE SHOW" },

  { time: 19.5, text: "BUT I KNOW" },

  { time: 20.5, text: "YOU NEVER SAW ME" },

  { time: 23.8, text: "WHEN THE LIGHTS COME ON" },

  { time: 26.0, text: "AND I'M ON MY OWN," },

  { time: 27.5, text: "WILL YOU BE MY OWN," },

  { time: 28.5, text: "WILL YOU BE THERE?" },

  { time: 30.0, text: "BE THERE?" },

  { time: 33.0, text: "CAN" },

  { time: 33.8, text: "CAN I BE THE ONE" },

  { time: 35.0, text: "YOU TALK ABOUT" },

  { time: 36.8, text: "IN ALL YOUR" },

  { time: 37.8, text: "STORIES?" },

  { time: 40.8, text: "CAN I BE" },

  { time: 42.0, text: "CAN I BE HIM?", hype: true },

  { time: 44.0, text: "" }

];


/* =========================================
   ELEMENTS
========================================= */

const video =
  document.getElementById("video");

const stage =
  document.getElementById("stage");

const lyricsEl =
  document.getElementById("lyrics");

const redwash =
  document.getElementById("redwash");

const canvas =
  document.getElementById("wave");

const ctx =
  canvas.getContext("2d");

const overlay =
  document.getElementById("unmuteOverlay");

const flash =
  document.getElementById("flash");


/* =========================================
   CANVAS
========================================= */

function resizeCanvas() {

  const dpr =
    Math.min(window.devicePixelRatio || 1, 2);

  canvas.width =
    window.innerWidth * dpr;

  canvas.height =
    window.innerHeight * dpr;

  canvas.style.width =
    window.innerWidth + "px";

  canvas.style.height =
    window.innerHeight + "px";

  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );
}

resizeCanvas();

window.addEventListener(
  "resize",
  resizeCanvas
);


/* =========================================
   AUDIO ANALYSER
========================================= */

let audioCtx = null;
let analyser = null;
let source = null;
let dataArray = null;

let audioReady = false;


function setupAudio() {

  if (audioReady) return;

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    if (!AudioContext) return;

    audioCtx = new AudioContext();

    source =
      audioCtx.createMediaElementSource(video);

    analyser =
      audioCtx.createAnalyser();

    analyser.fftSize = 256;

    analyser.smoothingTimeConstant = .78;

    dataArray =
      new Uint8Array(
        analyser.frequencyBinCount
      );

    source.connect(analyser);

    analyser.connect(
      audioCtx.destination
    );

    audioReady = true;

  } catch (error) {

    console.log(
      "Audio setup error:",
      error
    );

  }
}


/* =========================================
   WAVEFORM
========================================= */

function drawWave() {

  requestAnimationFrame(drawWave);

  if (!analyser) return;

  analyser.getByteFrequencyData(
    dataArray
  );

  const width =
    window.innerWidth;

  const height =
    window.innerHeight;

  ctx.clearRect(
    0,
    0,
    width,
    height
  );

  const centerY =
    height / 2;

  const bars =
    dataArray.length;

  const spacing =
    width / bars;

  const hype =
    lyricsEl.classList.contains("hype");


  for (let i = 0; i < bars; i++) {

    const amp =
      dataArray[i] / 255;

    const barHeight =
      amp * height * .30;

    const x =
      i * spacing;

    const alpha =
      .08 + amp * .38;

    ctx.fillStyle =
      hype
        ? `rgba(255,25,35,${alpha})`
        : `rgba(180,190,255,${alpha})`;


    /* top */
    ctx.fillRect(
      x,
      centerY - barHeight,
      Math.max(1, spacing - 2),
      barHeight
    );


    /* bottom */
    ctx.fillRect(
      x,
      centerY,
      Math.max(1, spacing - 2),
      barHeight
    );
  }
}


/* =========================================
   LYRICS
========================================= */

let lastText = null;
let lastHype = false;


function updateLyrics() {

  const time =
    video.currentTime;

  let current =
    lyrics[0];


  for (const line of lyrics) {

    if (time >= line.time) {
      current = line;
    } else {
      break;
    }

  }


  if (
    current.text === lastText &&
    Boolean(current.hype) === lastHype
  ) {
    return;
  }


  lastText = current.text;
  lastHype = Boolean(current.hype);


  lyricsEl.style.opacity = "0";

  lyricsEl.classList.add("enter");


  setTimeout(() => {

    lyricsEl.textContent =
      current.text;


    lyricsEl.style.opacity = "1";

    lyricsEl.classList.remove("enter");


    if (current.hype) {

      lyricsEl.classList.add("hype");

      redwash.classList.add("on");

      stage.classList.add("zoom");

      flash.classList.remove("active");

      void flash.offsetWidth;

      flash.classList.add("active");

    } else {

      lyricsEl.classList.remove("hype");

      redwash.classList.remove("on");

      stage.classList.remove("zoom");

    }

  }, 120);

}


/* =========================================
   MAIN LOOP
========================================= */

function animationLoop() {

  requestAnimationFrame(
    animationLoop
  );

  updateLyrics();

}

animationLoop();


/* =========================================
   AUTOPLAY
========================================= */

/*
  IMPORTANT:

  Mobile browsers generally allow
  autoplay ONLY when muted.

  Therefore:
  1. video starts automatically muted
  2. first tap enables sound
*/

async function startAutoplay() {

  try {

    video.muted = true;

    await video.play();

    console.log(
      "Autoplay started."
    );

  } catch (error) {

    console.log(
      "Autoplay blocked:",
      error
    );

  }

}


/* =========================================
   ENABLE SOUND
========================================= */

async function enableSound() {

  setupAudio();


  try {

    video.muted = false;

    if (audioCtx) {

      if (
        audioCtx.state === "suspended"
      ) {

        await audioCtx.resume();

      }

    }


    await video.play();


    overlay.classList.add(
      "hidden"
    );


    drawWave();


  } catch (error) {

    console.log(
      "Sound activation error:",
      error
    );

    /*
      Fallback:
      keep video playing muted
    */

    video.muted = true;

    try {
      await video.play();
    } catch(e) {}

  }

}


/* =========================================
   FIRST USER INTERACTION
========================================= */

overlay.addEventListener(
  "pointerdown",
  enableSound,
  { once: true }
);


/* =========================================
   ALSO SUPPORT TOUCH / CLICK
========================================= */

document.addEventListener(
  "touchstart",
  enableSound,
  { once: true, passive: true }
);

document.addEventListener(
  "click",
  enableSound,
  { once: true }
);


/* =========================================
   PAGE LOAD
========================================= */

window.addEventListener(
  "DOMContentLoaded",
  () => {

    startAutoplay();

  }
);


/* =========================================
   VISIBILITY RECOVERY
========================================= */

document.addEventListener(
  "visibilitychange",
  () => {

    if (
      document.visibilityState === "visible"
    ) {

      video.play().catch(() => {});

    }

  }
);

</script>

</body>
  </html>
