<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lyric Visualizer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090a0f;
      font-family: 'IBM Plex Mono', monospace;
      color: #ffffff;
    }

    /* Background Video */
    .video-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      filter: brightness(0.4) contrast(1.15) saturate(1.2);
    }

    /* Ambient Overlay */
    .overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, rgba(9, 10, 15, 0.3) 0%, rgba(9, 10, 15, 0.85) 100%);
      z-index: 1;
      pointer-events: none;
    }

    /* Main Container */
    .container {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 2rem;
    }

    .title {
      font-family: 'Anton', sans-serif;
      font-size: clamp(3rem, 10vw, 7rem);
      letter-spacing: 3px;
      text-transform: uppercase;
      background: linear-gradient(180deg, #ffffff 20%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 35px rgba(255, 255, 255, 0.2);
      animation: float 4s ease-in-out infinite;
    }

    .subtext {
      font-size: clamp(0.85rem, 2vw, 1.15rem);
      color: #cbd5e1;
      margin-top: 1rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.8;
    }

    /* Unmute Notification */
    #unmuteNotice {
      position: fixed;
      bottom: 30px;
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(10px);
      border-radius: 9999px;
      font-size: 0.85rem;
      letter-spacing: 1px;
      cursor: pointer;
      z-index: 10;
      transition: all 0.3s ease;
      display: none;
    }

    #unmuteNotice:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: scale(1.05);
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-10px);
      }
    }
  </style>
</head>
<body>

  <!-- Video Background with Loop -->
  <video id="bgVideo" class="video-bg" playsinline loop autoplay>
    <source src="../can i be him/public/video.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>

  <div class="overlay"></div>

  <button id="unmuteNotice">🔊 Click anywhere to enable sound</button>

  <main class="container">
    <h1 class="title">Can I Be Him</h1>
    <p class="subtext">Lyric Visualizer</p>
  </main>

  <script>
    const video = document.getElementById('bgVideo');
    const unmuteNotice = document.getElementById('unmuteNotice');

    // Attempt direct autoplay with sound
    video.muted = false;
    const playPromise = video.play();

    if (playPromise !== undefined) {
      playPromise.catch(() => {
        // Fall back to muted playback if autoplay policy prevents audio
        video.muted = true;
        video.play();
        unmuteNotice.style.display = 'block';
      });
    }

    // Unmute on the first interaction anywhere on the document
    const enableAudio = () => {
      video.muted = false;
      unmuteNotice.style.display = 'none';
      window.removeEventListener('click', enableAudio);
      window.removeEventListener('keydown', enableAudio);
    };

    window.addEventListener('click', enableAudio);
    window.addEventListener('keydown', enableAudio);
  </script>
</body>
</html>
